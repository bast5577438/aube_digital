<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bastien Vanniere — Développeur Web Freelance</title>
  <meta name="description" content="Développeur Web Freelance · Product Builder IA · Paris, France">
  <meta property="og:title" content="Bastien Vanniere">
  <meta property="og:description" content="Développeur Web Freelance · Product Builder IA · Paris, France">
  <meta property="og:type" content="profile">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --surface-2: #1e1e1e;
      --border: #252525;
      --accent: #8B1A2E;
      --accent-hover: #a31f35;
      --text: #ffffff;
      --text-muted: #888;
      --text-dim: #444;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.25rem;
    }

    .card { max-width: 400px; width: 100%; }

    .photo-wrap { display: flex; justify-content: center; margin-bottom: 1.75rem; }

    .photo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      border: 2.5px solid var(--accent);
    }

    .photo-placeholder {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: var(--surface);
      border: 2.5px solid var(--accent);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .photo-placeholder svg { width: 44px; height: 44px; stroke: #333; }

    .identity { text-align: center; margin-bottom: 2rem; }

    .accent-bar {
      width: 32px;
      height: 2px;
      background: var(--accent);
      margin: 0 auto 1.25rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .role {
      font-size: 0.78rem;
      color: var(--accent);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-top: 0.65rem;
      line-height: 1.6;
    }

    .location {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 0.4rem;
    }

    .btn-save {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: var(--accent);
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 0.75rem;
      transition: background 0.15s;
    }
    .btn-save:hover { background: var(--accent-hover); }
    .btn-save svg { width: 17px; height: 17px; flex-shrink: 0; }

    .contacts { display: flex; flex-direction: column; gap: 0.55rem; }

    .row {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.85rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      transition: background 0.15s, border-color 0.15s;
    }
    .row:hover { background: var(--surface-2); border-color: #333; }

    .row-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .row-icon svg { width: 18px; height: 18px; }

    .row-info { flex: 1; min-width: 0; }
    .row-main { font-size: 0.875rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-sub { font-size: 0.72rem; color: var(--text-muted); margin-top: 1px; }
    .row-arrow { color: var(--text-dim); font-size: 1rem; }

    .qr-section {
      margin-top: 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
    }

    .qr-label {
      font-size: 0.68rem;
      color: var(--text-dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #qr { background: #fff; padding: 10px; border-radius: 10px; display: inline-block; }

    .footer {
      text-align: center;
      font-size: 0.65rem;
      color: var(--text-dim);
      margin-top: 2rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

        <div class="row-icon">

            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
          </svg>
        </div>
        <div class="row-info">
          <div class="row-main">LinkedIn</div>

    </div>

    <div class="qr-section">

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
